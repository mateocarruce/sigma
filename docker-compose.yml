version: "3.9"

# ═══════════════════════════════════════════════════════
# SIGMA - Orquestación completa del stack
# ═══════════════════════════════════════════════════════

services:

  # ---------------------------------------------------
  # PostgreSQL: base de datos principal
  # ---------------------------------------------------
  postgres:
    image: postgres:15
    container_name: sigma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - sigma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sigma-network

  # ---------------------------------------------------
  # MinIO: almacenamiento de objetos (equivalente a S3)
  # ---------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sigma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - sigma-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sigma-network

  # ---------------------------------------------------
  # minio-init: se ejecuta UNA VEZ para crear el bucket
  # y configurar políticas, luego el contenedor termina.
  # ---------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: sigma-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set sigma-local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing sigma-local/$${MINIO_BUCKET};
      mc version enable sigma-local/$${MINIO_BUCKET};
      mc anonymous set none sigma-local/$${MINIO_BUCKET};
      echo 'Bucket $${MINIO_BUCKET} listo (privado, versionado habilitado).';
      exit 0;
      "
    networks:
      - sigma-network

  # ---------------------------------------------------
  # NestJS: API principal
  # ---------------------------------------------------
  nest-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigma-nest-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${NEST_PORT}
    ports:
      - "${NEST_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sigma-network

  # ---------------------------------------------------
  # FastAPI: microservicio de Machine Learning
  # ---------------------------------------------------
  fastapi-ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: sigma-fastapi-ml
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${FASTAPI_PORT}
    ports:
      - "${FASTAPI_PORT}:8000"
    depends_on:
      nest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sigma-network

  # ---------------------------------------------------
  # React: frontend (servido con Vite en modo dev)
  # ---------------------------------------------------
  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigma-react-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - nest-api
    networks:
      - sigma-network

networks:
  sigma-network:
    driver: bridge

volumes:
  sigma-postgres-data:
  sigma-minio-data:
