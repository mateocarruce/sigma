version: "3.9"

# Solo PostgreSQL, para probar sigma-backend-completo de forma aislada
# sin necesitar MinIO/FastAPI/React corriendo. Usa el mismo .env del backend.

services:
  postgres:
    image: postgres:15
    container_name: sigma-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - sigma-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sigma-postgres-test-data:
